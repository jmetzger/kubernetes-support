---
- name: K8s Workernode deploy
  hosts: svr-edv-otofu1
  gather_facts: false
  become: true
  become_user: root
  vars:
    ansible_shell_allow_world_readable_temp: true

  tasks:
    - name: Zielverzeichnis anlegen
      file:
        path: /opt/tofu/k8s/workernode
        state: directory
        mode: '0755'

    - name: main.tf übertragen
      copy:
        src: "{{ playbook_dir }}/main.tf"
        dest: /opt/tofu/k8s/workernode/main.tf

    - name: variables.tf übertragen
      copy:
        src: "{{ playbook_dir }}/variables.tf"
        dest: /opt/tofu/k8s/workernode/variables.tf

    - name: outputs.tf übertragen
      copy:
        src: "{{ playbook_dir }}/outputs.tf"
        dest: /opt/tofu/k8s/workernode/outputs.tf

    - name: tofu init
      command: tofu init -input=false -reconfigure
      args:
        chdir: /opt/tofu/k8s/workernode
      environment:
        TF_HTTP_ADDRESS: "https://gitlab.isgus.de/api/v4/projects/31/terraform/state/{{ vm_prefix }}-wn"
        TF_HTTP_LOCK_ADDRESS: "https://gitlab.isgus.de/api/v4/projects/31/terraform/state/{{ vm_prefix }}-wn/lock"
        TF_HTTP_UNLOCK_ADDRESS: "https://gitlab.isgus.de/api/v4/projects/31/terraform/state/{{ vm_prefix }}-wn/lock"
        TF_HTTP_LOCK_METHOD: "POST"
        TF_HTTP_UNLOCK_METHOD: "DELETE"

    - name: tofu apply
      command: tofu apply -input=false -auto-approve
      args:
        chdir: /opt/tofu/k8s/workernode
      environment:
        # vSphere Credentials – von AWX Credential Injector
        TF_VAR_vcenter_server: "{{ lookup('env', 'VSPHERE_SERVER') }}"
        TF_VAR_vcenter_user: "{{ lookup('env', 'VSPHERE_USER') }}"
        TF_VAR_vcenter_password: "{{ lookup('env', 'VSPHERE_PASSWORD') }}"
        # Survey-Variablen
        TF_VAR_vm_prefix: "{{ vm_prefix }}"
        TF_VAR_worker_prefix: "{{ worker_prefix }}"
        TF_VAR_worker_count: "{{ worker_count | int }}"
        TF_VAR_worker_base_ip: "{{ worker_base_ip }}"
        TF_VAR_worker_cpu: "{{ worker_cpu | int }}"
        TF_VAR_worker_ram: "{{ worker_ram | int }}"
        TF_VAR_worker_disk: "{{ worker_disk | int }}"
        TF_VAR_cluster: "{{ cluster }}"
        TF_VAR_datastore: "{{ datastore }}"
        TF_VAR_network: "{{ network }}"
        TF_VAR_gateway: "{{ gateway }}"
        # GitLab State Backend
        TF_HTTP_ADDRESS: "https://gitlab.isgus.de/api/v4/projects/31/terraform/state/{{ vm_prefix }}-wn"
        TF_HTTP_LOCK_ADDRESS: "https://gitlab.isgus.de/api/v4/projects/31/terraform/state/{{ vm_prefix }}-wn/lock"
        TF_HTTP_UNLOCK_ADDRESS: "https://gitlab.isgus.de/api/v4/projects/31/terraform/state/{{ vm_prefix }}-wn/lock"
        TF_HTTP_LOCK_METHOD: "POST"
        TF_HTTP_UNLOCK_METHOD: "DELETE"

    - name: tofu output als JSON speichern
      command: tofu output -json
      args:
        chdir: /opt/tofu/k8s/workernode
      register: worker_output
      environment:
        TF_HTTP_ADDRESS: "https://gitlab.isgus.de/api/v4/projects/31/terraform/state/{{ vm_prefix }}-wn"

    - name: Worker Inventory speichern
      copy:
        dest: /opt/tofu/k8s/inventory/worker.json
        content: "{{ worker_output.stdout }}"