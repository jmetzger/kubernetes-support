- name: OpenTofu delete
  hosts: all
  gather_facts: false
  become: true
  become_user: root
  vars:
    ansible_shell_allow_world_readable_temp: true

  tasks:
    - name: Zielverzeichnis anlegen
      file:
        path: /opt/tofu/destroy
        state: directory
        mode: '0755'

    - name: main.tf übertragen
      copy:
        src: "{{ playbook_dir }}/main.tf"
        dest: /opt/tofu/destroy/main.tf

    - name: variables.tf übertragen
      copy:
        src: "{{ playbook_dir }}/variables.tf"
        dest: /opt/tofu/destroy/variables.tf

    - name: tofu init
      command: tofu init -input=false -reconfigure
      args:
        chdir: /opt/tofu/destroy
      environment:
        TF_HTTP_ADDRESS: "https://gitlab.isgus.de/api/v4/projects/31/terraform/state/{{ vm_prefix }}"
        TF_HTTP_LOCK_ADDRESS: "https://gitlab.isgus.de/api/v4/projects/31/terraform/state/{{ vm_prefix }}/lock"
        TF_HTTP_UNLOCK_ADDRESS: "https://gitlab.isgus.de/api/v4/projects/31/terraform/state/{{ vm_prefix }}/lock"
        TF_HTTP_LOCK_METHOD: "POST"
        TF_HTTP_UNLOCK_METHOD: "DELETE"

    - name: tofu destroy
      command: tofu destroy -input=false -auto-approve
      args:
        chdir: /opt/tofu/destroy
      environment:
        # vSphere Credentials – von AWX Credential Injector
        TF_VAR_vcenter_server: "{{ lookup('env', 'VSPHERE_SERVER') }}"
        TF_VAR_vcenter_user: "{{ lookup('env', 'VSPHERE_USER') }}"
        TF_VAR_vcenter_password: "{{ lookup('env', 'VSPHERE_PASSWORD') }}"
        # Pflicht-Variablen damit tofu destroy funktioniert
        TF_VAR_vm_prefix: "{{ vm_prefix }}"
        TF_VAR_vm_count: "1"
        TF_VAR_num_cpus: "2"
        TF_VAR_memory: "4096"
        TF_VAR_cluster: "{{ cluster }}"
        TF_VAR_datastore: "{{ datastore }}"
        TF_VAR_network: "{{ network }}"
        TF_VAR_ip_network: "10.78.80.0/24"
        TF_VAR_ip_start: "200"
        TF_VAR_gateway: "10.78.80.199"
        # GitLab State Backend
        TF_HTTP_ADDRESS: "https://gitlab.isgus.de/api/v4/projects/31/terraform/state/{{ vm_prefix }}"
        TF_HTTP_LOCK_ADDRESS: "https://gitlab.isgus.de/api/v4/projects/31/terraform/state/{{ vm_prefix }}/lock"
        TF_HTTP_UNLOCK_ADDRESS: "https://gitlab.isgus.de/api/v4/projects/31/terraform/state/{{ vm_prefix }}/lock"
        TF_HTTP_LOCK_METHOD: "POST"
        TF_HTTP_UNLOCK_METHOD: "DELETE"
