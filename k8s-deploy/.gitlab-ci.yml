# K8s Cluster Deployment Pipeline
# Trigger: CI/CD -> Pipelines -> Run pipeline
# Alle Jobs sind manuell — nur die gewuenschten Jobs anstossen.
#
# Masked+Protected CI/CD Variablen (einmalig in GitLab setzen):
#   TF_VAR_vcenter_password  — vSphere Passwort (OpenTofu + Packer)

stages:
  - packer
  - plan
  - deploy
  - destroy

# -------------------------------------------------------------------
# Packer — VM-Images bauen
# -------------------------------------------------------------------
variables:
  K8S_TEMPLATE_NAME:
    value: "VMk8s"
    description: "Name des K8s VM-Templates in der vSphere Content Library"
  HAPROXY_TEMPLATE_NAME:
    value: "VMhaproxy"
    description: "Name des HAProxy VM-Templates in der vSphere Content Library"

# -------------------------------------------------------------------
# OpenTofu — Cluster deployen
# -------------------------------------------------------------------
  CLUSTER_NAME:
    value: "prod-k8s-1"
    description: "Eindeutiger Cluster-Name — wird als State-Name verwendet (z.B. prod-k8s-1, dev-k8s-2)"
  CP_COUNT:
    value: "3"
    description: "Anzahl Control Plane Nodes (empfohlen: 3 fuer HA)"
  WORKER_COUNT:
    value: "3"
    description: "Anzahl Worker Nodes"
  HAPROXY_BASE_IP:
    value: "10.0.0.20"
    description: "Start-IP fuer HAProxy VMs (lb-1 bekommt diese IP, lb-2 die naechste)"
  CP_BASE_IP:
    value: "10.0.0.10"
    description: "Start-IP fuer Control Plane VMs (cp-1 bekommt diese IP, cp-2 die naechste, ...)"
  WORKER_BASE_IP:
    value: "10.0.0.30"
    description: "Start-IP fuer Worker VMs (worker-1 bekommt diese IP, worker-2 die naechste, ...)"
  TF_ROOT: "k8s-deploy/opentofu"

include:
  - local: 'k8s-deploy/ci/packer.yml'
  - local: 'k8s-deploy/ci/opentofu.yml'
