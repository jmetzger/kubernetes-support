---
- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Deploy app config
  ansible.builtin.template:
    src: app.conf.j2
    dest: /etc/myapp/config.ini
    mode: '0640'
    owner: root
    group: www-data

- name: Start nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
